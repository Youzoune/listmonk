{{ define "admin-login-setup" }}
{{ template "auth-header" . }}
	<h1>Bienvenue sur Relais</h1>
	<p class="lead">Créez le premier compte : il aura tous les droits sur l’instance.</p>

	{{ if .Data.Error }}<p class="error" role="alert">{{ .Data.Error }}</p>{{ end }}

	<form method="post" action="">
		<input type="hidden" name="nonce" value="{{ .Data.Nonce }}" />
		<input type="hidden" name="next" value="{{ .Data.NextURI }}" />
		<div class="field">
			<label for="email">Adresse e-mail</label>
			<input id="email" type="email" name="email" autocomplete="email" autofocus required minlength="3" />
		</div>
		<div class="field">
			<label for="username">Identifiant</label>
			<input id="username" type="text" name="username" autocomplete="username" required minlength="3" />
		</div>
		<div class="field">
			<label for="password">Mot de passe</label>
			<input id="password" type="password" name="password" autocomplete="new-password" required minlength="8" />
		</div>
		<div class="field">
			<label for="password2">Répétez le mot de passe</label>
			<input id="password2" type="password" name="password2" autocomplete="new-password" required minlength="8" />
		</div>
		<button class="btn btn-primary" type="submit">Créer le compte</button>
	</form>
{{ template "auth-footer" . }}
{{ end }}
