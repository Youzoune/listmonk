{{ define "admin-reset-password" }}
{{ template "auth-header" . }}
	<h1>Nouveau mot de passe</h1>

	{{ if .Data.Error }}<p class="error" role="alert">{{ .Data.Error }}</p>{{ end }}

	<form method="post" action="/admin/reset?token={{ .Data.Token }}&email={{ .Data.Email }}">
		<div class="field">
			<label for="password">Nouveau mot de passe</label>
			<input id="password" type="password" name="password" autocomplete="new-password" autofocus required minlength="8" />
		</div>
		<div class="field">
			<label for="password2">Répétez le mot de passe</label>
			<input id="password2" type="password" name="password2" autocomplete="new-password" required minlength="8" />
		</div>
		<button class="btn btn-primary" type="submit">Enregistrer le mot de passe</button>
	</form>
{{ template "auth-footer" . }}
{{ end }}
