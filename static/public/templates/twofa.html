{{ define "admin-twofa" }}
{{ template "auth-header" . }}
	<h1>Double authentification</h1>
	<p class="lead">Saisissez le code à 6 chiffres affiché par votre application d’authentification.</p>

	{{ if .Data.Error }}<p class="error" role="alert">{{ .Data.Error }}</p>{{ end }}

	<form method="post" action="/admin/login/twofa">
		<input type="hidden" name="token" value="{{ .Data.Token }}" />
		<input type="hidden" name="next" value="{{ .Data.NextURI }}" />
		<div class="field">
			<label for="totp_code">Code</label>
			<input id="totp_code" class="code" type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code"
				autofocus required pattern="[0-9]{6}" maxlength="6" />
		</div>
		<button class="btn btn-primary" type="submit">Continuer</button>
	</form>
{{ template "auth-footer" . }}
{{ end }}
